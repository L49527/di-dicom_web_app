<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DICOM 研究代號轉換 · v4.2</title><link rel="stylesheet" href="style.css"></head>
<body><header><div><h1>DICOM 研究代號轉換 <small>v4.2</small></h1><p>本機處理 · 影像與院內紀錄分開儲存</p></div><nav><a href="https://github.com/L49527/di-dicom_web_app" target="_blank" rel="noopener">GitHub</a><button id="reset">重設本批</button></nav></header>
<main><aside class="panel"><section><h2>資料夾</h2>
<button class="folder" id="input">原始 DICOM <span>選擇輸入資料夾</span></button>
<button class="folder" id="images">研究影像 <span>選擇影像輸出資料夾</span></button>
<button class="folder" id="records">院內紀錄 <span>選擇對照表資料夾</span></button>
<p class="hint">請分別選擇三個獨立資料夾。院內紀錄含原始病歷號。</p></section>
<section><h2>處理模式</h2><div class="options">
<label><input type="radio" name="mode" value="auto"> 全部病人自動編號</label>
<label><input type="radio" name="mode" value="csv"> 依 CSV 指定研究代號</label></div>
<div id="csvPanel" hidden><div class="actions"><button id="importCsv">匯入 CSV</button><button id="template">下載範本</button></div><input id="csvFile" type="file" accept=".csv,text/csv" hidden><p id="csvInfo">尚未匯入 CSV</p>
<label id="ignoreLabel" class="exception"><input type="checkbox" id="ignore"> 日期不符時，仍輸出代號唯一的同一病人其他日期</label><button id="precheck">預檢名單</button></div></section>
<section><h2>標籤設定</h2><p class="hint">固定改寫病歷號、檢查單號及原有病人姓名。</p><details id="tagDetails"><summary>選擇額外清除欄位 <span id="tagCount">0 項</span></summary><button id="allTags">全選</button><div id="tags"></div></details></section></aside>
<article><section class="panel job"><h2>本批作業</h2><dl id="summary"></dl><p id="next" role="status"></p><button class="primary" id="start" disabled>開始轉換</button></section>
<section class="panel" id="progressPanel" hidden><h2 id="phase">處理中</h2><progress id="progress" value="0" max="1"></progress><p id="counter"></p></section>
<section class="panel" id="results" hidden aria-live="polite"><h2 id="resultTitle"></h2><div id="stats"></div><div id="notes"></div><details id="failures" hidden><summary id="failTitle">失敗清單</summary><div id="failTable" class="scroll"></div><button id="downloadFail">下載失敗清單 CSV</button></details><details id="matches" hidden><summary>檢視名單比對明細</summary><div id="matchTable" class="scroll"></div><button id="downloadMatch">下載比對清單 CSV</button></details></section>
<details class="panel" id="logPanel"><summary>執行紀錄</summary><ol id="log"></ol></details></article></main>
<script src="vendor/dicomParser.min.js"></script><script src="core.js"></script><script src="batch.js"></script><script src="app.js"></script></body></html>
